name: CI

# Pull requests: test, infra and image checks only.
# Pushes to main: the same checks, then one image deployed by digest to staging, then production after approval.
# Rollback: Actions → CI → Run workflow on main with rollback_image set to an earlier …@sha256:… reference.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      rollback_image:
        description: "Redeploy an earlier release: full image reference with @sha256:… (leave empty to build HEAD)"
        required: false
        type: string

permissions:
  contents: read

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_PROJECT_NUMBER: ${{ vars.GCP_PROJECT_NUMBER }}
  GCP_REGION: ${{ vars.GCP_REGION }}
  GCP_SQL_INSTANCE: ${{ vars.GCP_SQL_INSTANCE }}
  TEMPORAL_ADDRESS: ${{ vars.TEMPORAL_ADDRESS }}
  TEMPORAL_NAMESPACE: ${{ vars.TEMPORAL_NAMESPACE }}
  LLM_MODEL: ${{ vars.LLM_MODEL }}
  GOOGLE_CHAT_UPLOAD_MODE: ${{ vars.GOOGLE_CHAT_UPLOAD_MODE }}
  GOOGLE_CHAT_DELEGATED_USER: ${{ vars.GOOGLE_CHAT_DELEGATED_USER }}
  ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
  ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Chromium for PDF rendering, matching the pinned playwright-core version.
      - run: pnpm --filter @sd/render exec playwright-core install --with-deps chromium
      - run: pnpm typecheck
      - run: pnpm test
      # Runs the real workflow on a Temporal test server (downloaded here; blocked in some sandboxes).
      - run: pnpm test:temporal

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=infra/terraform fmt -check
      - run: terraform -chdir=infra/terraform init -backend=false
      - run: terraform -chdir=infra/terraform validate
      - name: shellcheck
        run: shellcheck infra/bootstrap.sh scripts/*.sh
      - name: actionlint
        run: |
          bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t system-designer:ci .
      # Chromium, fonts and the Temporal workflow bundle must work inside the production image.
      - run: docker run --rm system-designer:ci node apps/worker/src/image-smoke.ts

  build:
    # Deploys only from main, after every check above passes. Skips cleanly until the repository variables exist.
    needs: [test, infra, image]
    if: vars.GCP_PROJECT_ID != '' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - id: image
        env:
          ROLLBACK_IMAGE: ${{ inputs.rollback_image }}
          REPO: ${{ vars.GCP_IMAGE_REPO }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ -n "${ROLLBACK_IMAGE}" ]]; then
            [[ "${ROLLBACK_IMAGE}" == *@sha256:* ]] || { echo "rollback needs an image digest"; exit 1; }
            echo "image=${ROLLBACK_IMAGE}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
          docker build -t "${REPO}/system-designer:${SHA}" .
          docker push "${REPO}/system-designer:${SHA}"
          DIGEST="$(gcloud artifacts docker images describe "${REPO}/system-designer:${SHA}" --format 'value(image_summary.digest)')"
          echo "image=${REPO}/system-designer@${DIGEST}" >> "$GITHUB_OUTPUT"

  staging:
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Install Temporal CLI
        run: curl -sSf https://temporal.download/cli.sh | sh && echo "$HOME/.temporalio/bin" >> "$GITHUB_PATH"
      - run: scripts/deploy-env.sh staging "${{ needs.build.outputs.image }}"
        env:
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID_STAGING }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID_STAGING }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-staging
          path: release-staging.txt

  production:
    needs: [build, staging]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Install Temporal CLI
        run: curl -sSf https://temporal.download/cli.sh | sh && echo "$HOME/.temporalio/bin" >> "$GITHUB_PATH"
      - run: scripts/deploy-env.sh prod "${{ needs.build.outputs.image }}"
        env:
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID_PROD }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID_PROD }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-prod
          path: release-prod.txt
          
